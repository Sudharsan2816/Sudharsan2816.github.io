name: Scaling idea
description: What would break first at 10x or 100x the load or data, and what you'd change.
title: "[Scaling] "
labels: ["scaling"]
body:
  - type: markdown
    attributes:
      value: Rough numbers are fine. This issue is public.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Market Research Copilot
        - AI Code Review Agent
        - Permission-Aware RAG
        - This portfolio site
        - Something else
    validations:
      required: true
  - type: textarea
    id: breaks
    attributes:
      label: What breaks first
      description: The component, the load or data size where it starts to fail, and how you'd notice.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you'd change
      description: The design you'd move to, and what it costs.
    validations:
      required: true
